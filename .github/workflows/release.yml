name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          # No registry-url: it writes an empty _authToken to .npmrc, which stops npm from using OIDC
          package-manager-cache: false

      # No dependency install scripts: they would run with id-token: write
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test

      # Trusted publishing (OIDC via id-token: write) — no npm token stored.
      # Staged: the version goes public only after a maintainer approves it with 2FA.
      - run: npm stage publish --provenance

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="## [$VERSION]" '
            !found && index($0, ver) == 1 { found=1; next }
            found && /^## \[/             { exit }
            found && /^\[[^]]+\]:/        { exit }
            found                         { print }
          ' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "Release ${GITHUB_REF_NAME} — see [CHANGELOG](https://github.com/Atrakt/beer-color-rgb/blob/main/CHANGELOG.md) for details." > notes.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: notes.md
